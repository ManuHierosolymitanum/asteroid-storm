<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://motze-haminyan.github.io/">
<title>מוצא המניין עבר לכתובת חדשה</title>
<style>body{font-family:system-ui,Arial,sans-serif;background:#0b1a36;color:#fff;text-align:center;padding:40px 16px}a{color:#ffd979;font-size:20px}</style>
</head>
<body>
<p>מוצא המניין עבר לכתובת חדשה…</p>
<p><a id="go" href="https://motze-haminyan.github.io/">https://motze-haminyan.github.io</a></p>
<script>
// moves the user to the new address and brings their saved settings along
(function(){
  var data = {};
  try { for (var i = 0; i < localStorage.length; i++){ var k = localStorage.key(i); if (k.indexOf('mn_') === 0) data[k] = localStorage.getItem(k); } } catch(e){}
  var url = 'https://motze-haminyan.github.io/' + location.search + (Object.keys(data).length ? '#import=' + encodeURIComponent(JSON.stringify(data)) : '');
  document.getElementById('go').href = url;
  var go = function(){ location.replace(url); };
  try {
    navigator.serviceWorker.getRegistrations().then(function(rs){
      return Promise.all(rs.filter(function(r){ return /\/minyan\/$/.test(r.scope); }).map(function(r){ return r.unregister(); }));
    }).then(go, go);
    setTimeout(go, 1500);
  } catch(e){ go(); }
})();
</script>
</body>
</html>
