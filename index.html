  setTimeout(() => window.__fbDone(null), 12000);
  window.claude = {use: n => ready.then(api => api ? api.use(n) : null)};
})();
</script>

<style>
/* Layout: one full-screen canvas; menus are overlay screens; HUD on top (buttons + resources top-left, score top-right), power-up chips above the ability bar, touch pad at bottom. Deliberate single dark "deep space" look. */
:root{
  --space:#070b1f;
  --ink:#eaf2ff;
  --ship:#7fe8ff;
  --laser:#ffe066;
  --danger:#ff5d73;
  --coin:#ffc93c;
  --gem:#5ff3ff;
  --panel:rgba(12,20,52,.86);
  --line:rgba(234,242,255,.2);
  --font-display:"Secular One","Rubik",system-ui,sans-serif;
  --font-body:"Rubik",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--space);color:var(--ink);font-family:var(--font-body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;width:100%}
canvas{display:block;width:100%;height:100%}
button{font-family:inherit;color:inherit}
input,select{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ship);outline-offset:3px}
.i{width:1em;height:1em;vertical-align:-.15em;flex:none}

/* HUD: physical left = controls + resources, center = level, right = score */
.hud{position:absolute;top:0;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;padding:10px 16px;pointer-events:none;direction:ltr;font-variant-numeric:tabular-nums}
.hud .hl{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.hud .hbtns{display:flex;gap:6px}
.hud .hbtns button{pointer-events:auto;width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid rgba(127,232,255,.35);font-size:18px;cursor:pointer;display:grid;place-items:center;padding:0}
.hud .res{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-weight:700;font-size:14px;background:rgba(7,11,31,.45);border-radius:10px;padding:3px 8px}
.hud .lives{color:var(--danger);letter-spacing:.08em}
.hud .bombs{color:#c38bff}
.hud .coins{color:var(--coin)}
.hud .gemc{color:var(--gem)}
.hud .hc{text-align:center;font-family:var(--font-display);direction:var(--d,rtl);padding-top:4px}
.hud .lvl{color:var(--laser);font-size:clamp(15px,3vw,20px)}
.hud .combo{color:#8dff9a;font-size:15px;min-height:1.2em}
.hud .hr{justify-self:end;text-align:right}
.hud .sc{font-family:var(--font-display);font-size:clamp(26px,5.5vw,40px);line-height:1;text-shadow:0 0 16px rgba(127,232,255,.35)}
.hud .bst{font-size:12px;opacity:.7;direction:var(--d,rtl);margin-top:2px}
.chips{position:absolute;bottom:calc(86px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding-inline:16px;pointer-events:none}
body.touch .chips{bottom:calc(180px + env(safe-area-inset-bottom,0px))}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid currentColor;border-radius:999px;padding:3px 12px 3px 10px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.chip i{font-style:normal}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:16px;text-align:center;padding-inline:16px;padding-block:24px;background:radial-gradient(ellipse at center,rgba(7,11,31,.4),rgba(7,11,31,.9));overflow-y:auto;touch-action:pan-y}
.screen>*{flex-shrink:0}
.screen h1{font-family:var(--font-display);font-weight:400;font-size:clamp(40px,11vw,92px);margin:0;line-height:1;color:var(--ship);text-shadow:0 0 28px rgba(127,232,255,.6);text-wrap:balance}
.screen h2{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,6vw,44px);margin:0;color:var(--laser);line-height:1.1}
.screen h3{font-family:var(--font-display);font-weight:400;font-size:clamp(17px,3.2vw,22px);margin:0;color:var(--laser)}
.screen p{margin:0;font-size:clamp(14px,2.4vw,17px);max-width:36em;line-height:1.55;opacity:.9}
.screen .big{font-family:var(--font-display);font-size:clamp(22px,5vw,34px);color:var(--laser)}
.title-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.title-wrap .tag{font-family:var(--font-display);color:var(--laser);letter-spacing:.2em;font-size:clamp(13px,2.4vw,17px)}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.home h1{animation:floaty 4s ease-in-out infinite}
.corner{position:absolute;top:14px;left:16px;width:46px;height:46px;border-radius:14px;background:var(--panel);border:2px solid var(--line);font-size:22px;cursor:pointer;display:grid;place-items:center;padding:0}
.corner.pr{left:auto;right:16px;width:auto;max-width:46%;display:flex;gap:8px;padding:0 12px 0 6px;font-size:14px;font-weight:700}
.corner.pr .pa{font-size:24px}
.corner.pr .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home{padding-top:72px}

.go{font-family:var(--font-display);font-size:clamp(22px,5vw,30px);background:var(--laser);color:var(--space);border:0;border-radius:16px;padding:10px 40px;cursor:pointer;box-shadow:0 0 0 4px rgba(255,224,102,.25),0 8px 30px rgba(255,224,102,.3)}
.go.small{font-size:18px;padding:8px 22px;box-shadow:none}
.menu{display:flex;flex-direction:column;gap:10px;width:min(300px,100%)}
.menu .go{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(360px,100%)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:17px;cursor:pointer}
.btn:hover{border-color:rgba(127,232,255,.6)}
.btn .ico{font-size:20px}
.btn.small{font-size:15px;padding:7px 14px;border-radius:10px}
.btn.danger{border-color:rgba(255,93,115,.6);color:var(--danger)}
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;font-family:var(--font-display);font-size:18px}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 16px;font-variant-numeric:tabular-nums}
.badge.coin{color:var(--coin);border-color:rgba(255,201,60,.5)}
.badge.gem{color:var(--gem);border-color:rgba(95,243,255,.5)}
.badge.best{color:var(--ship)}

.ships{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:680px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:120px;padding:10px 8px;border-radius:14px;border:2px solid var(--line);background:var(--panel);cursor:pointer}
.card b{font-family:var(--font-display);font-weight:400;font-size:20px}
.card span{font-size:12px;opacity:.8;line-height:1.3}
.card.sel{border-color:var(--laser);box-shadow:0 0 18px rgba(255,224,102,.35)}
.card.locked svg:not(.i){opacity:.3}
.card .lock{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;opacity:1;color:var(--coin)}
.card .lock.g{color:var(--gem)}
.card .lock.r{color:#ff9aa8}
.card>svg{width:44px;height:44px}
.seg{display:flex;flex-wrap:wrap;justify-content:center;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:8px 16px;font-size:15px;cursor:pointer}
.seg button+button{border-inline-start:2px solid var(--line)}
.seg button.sel{background:var(--laser);color:var(--space);font-weight:700}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.pills button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.pills button.sel{background:var(--ship);color:var(--space);border-color:var(--ship);font-weight:700}

.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:10px;width:min(760px,100%)}
.item{display:flex;align-items:center;gap:12px;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.item .ic{flex:none;width:44px;height:44px;display:grid;place-items:center;font-size:22px;border-radius:50%;border:2px solid currentColor}
.item .ic svg{width:34px;height:34px}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .tx b{font-size:15px}
.item .tx span{font-size:12px;opacity:.75;line-height:1.35}
.item.gold{border-color:rgba(95,243,255,.35)}
.dots{display:flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;border:1px solid var(--coin)}
.dots i.on{background:var(--coin)}
.buy{flex:none;display:inline-flex;align-items:center;gap:5px;background:var(--coin);color:var(--space);border:0;border-radius:10px;padding:7px 11px;font-weight:700;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.buy.g{background:var(--gem)}
.buy.poor{background:transparent;color:var(--ink);border:1px dashed var(--line)}
.buy.lockd{background:transparent;color:#ff9aa8;border:1px dashed rgba(255,154,168,.5)}
.owned{flex:none;font-size:13px;color:#8dff9a;font-weight:700}

.trophies{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;width:min(760px,100%)}
.trophy{display:flex;align-items:center;gap:10px;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.trophy .cup{flex:none;font-size:26px;filter:grayscale(1) brightness(.5)}
.trophy.got{border-color:rgba(255,201,60,.6)}
.trophy.got .cup{filter:none}
.trophy .tx{display:flex;flex-direction:column;min-width:0}
.trophy b{font-size:15px}
.trophy span{font-size:12px;opacity:.75}
.help{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:8px 16px;width:min(760px,100%);text-align:start;font-size:14px}
.help div{display:flex;align-items:center;gap:8px;min-width:0}
.help i{font-style:normal;display:grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid currentColor;font-size:13px}
kbd{font-family:var(--font-body);background:var(--panel);border:1px solid rgba(234,242,255,.3);border-radius:6px;padding:1px 7px;direction:ltr;display:inline-block}

/* leaderboards */
.lb{display:flex;flex-direction:column;gap:6px;width:min(560px,100%)}
.lbrow{display:grid;grid-template-columns:2.4em 2em 1fr auto;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 12px;text-align:start;font-variant-numeric:tabular-nums}
.lbrow .pos{font-family:var(--font-display);color:var(--laser);text-align:center}
.lbrow .av{font-size:22px;text-align:center}
.lbrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.lbrow .nm small{font-weight:400;opacity:.7;margin-inline-start:6px}
.lbrow .val{font-family:var(--font-display);font-size:18px}
.lbrow.me{border-color:var(--laser);box-shadow:0 0 14px rgba(255,224,102,.25)}
.lbrow.top1 .pos{color:#ffd23f}.lbrow.top2 .pos{color:#dfe8ff}.lbrow.top3 .pos{color:#ff9f43}
.lbgap{opacity:.5;font-size:18px;line-height:1}
.note{font-size:13px!important;opacity:.7!important}

/* profile */
.pcard{display:flex;align-items:center;gap:14px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 20px;text-align:start}
.pcard .pav{font-size:48px;line-height:1}
.pcard b{display:block;font-family:var(--font-display);font-size:24px;font-weight:400}
.pcard small{opacity:.8}
.fld{display:flex;flex-direction:column;gap:4px;width:min(340px,100%);text-align:start;font-size:14px}
.fld input,.fld select{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:9px 12px;font-size:17px}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;width:min(420px,100%)}
.avs button{aspect-ratio:1;font-size:24px;background:var(--panel);border:2px solid var(--line);border-radius:12px;cursor:pointer;padding:0}
.avs button.sel{border-color:var(--laser);box-shadow:0 0 12px rgba(255,224,102,.4)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px;width:min(620px,100%)}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.stats b{font-family:var(--font-display);font-size:22px;font-weight:400;color:var(--ship);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;opacity:.75}
@media (max-width:420px){.avs{grid-template-columns:repeat(4,1fr)}}

/* settings */
.sets{display:flex;flex-direction:column;gap:8px;width:min(520px,100%)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 14px;text-align:start;flex-wrap:wrap}
.set>span{font-weight:700}
.set .seg button{padding:6px 12px;font-size:14px}
.tog{position:relative;width:54px;height:30px;border-radius:999px;border:2px solid var(--line);background:rgba(234,242,255,.1);cursor:pointer;padding:0;flex:none}
.tog::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:inset-inline-start .15s}
.tog.on{background:#3fbf6a;border-color:#3fbf6a}
.tog.on::after{inset-inline-start:27px}
.set input[type=range]{width:min(200px,50vw);accent-color:var(--laser)}

.toasts{position:absolute;z-index:7;top:96px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{display:flex;align-items:center;gap:10px;background:rgba(40,28,6,.94);border:2px solid var(--coin);border-radius:14px;padding:8px 16px;font-weight:700;animation:pop .4s ease-out}
.toast small{display:block;font-weight:400;opacity:.85}
@keyframes pop{from{transform:translateY(-20px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.modal{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(3,5,15,.7);padding:16px;touch-action:pan-y}
.modal .box{background:#0e1738;border:2px solid rgba(127,232,255,.4);border-radius:20px;padding:20px 22px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .25s ease-out}
.modal h3{font-family:var(--font-display);font-weight:400;font-size:24px;margin:0;color:var(--laser)}
.modal p,#mBody{margin:0;line-height:1.5}
.btn.msg{border-color:rgba(127,232,255,.5)}
.btn.inst{border-color:rgba(195,139,255,.55)}
.steps{display:flex;flex-direction:column;gap:8px;margin-top:10px;text-align:start}
.steps div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.steps div.me{border-color:#ffd23f}
.steps b{display:block;margin-bottom:2px}
.nb{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#ff5d73;color:#fff;font-size:12px;font-weight:700;margin-inline-start:6px;line-height:1}
.chat{display:flex;flex-direction:column;gap:6px;max-height:38vh;overflow:auto;margin:8px 0}
.chat:empty{display:none}
.bub{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere;text-align:start;position:relative}
.bub.a{align-self:flex-end;border-color:rgba(255,210,63,.6)}
.bub small{display:block;opacity:.6;font-size:11px}
.bub .x{background:none;border:0;color:inherit;opacity:.6;cursor:pointer;font-size:12px;padding:0 0 0 6px}
textarea.ain{width:100%;resize:vertical;font:inherit;font-size:16px;text-transform:none;color:inherit}

function loadInto(o){
  if (!o || typeof o !== 'object') return;
  const old = !o.v;
  for (const k of ['best','coins','xp','ship','diff','runBest','bonusAt']) if (k in o) save[k] = num(o[k]);
  if (o.duel && typeof o.duel === 'object') save.duel = {w:num(o.duel.w), l:num(o.duel.l)};
  if ('gems' in o) save.gems = num(o.gems, 5);
  if (Array.isArray(o.owned)) save.owned = o.owned.filter(i => SHIPS[i]);
  if (Array.isArray(o.abils)) save.abils = o.abils.filter(id => ABILS.some(a => a.id === id));
  if (Array.isArray(o.loadout)) save.loadout = o.loadout.filter(id => ABILS.some(a => a.id === id));
  if (Array.isArray(o.skins)) save.skins = o.skins.filter(id => SKINS.some(k => k.id === id));
  save.skin = save.skins.includes(o.skin) ? o.skin : '';
  if (Array.isArray(o.redeemed)) save.redeemed = o.redeemed.filter(h => typeof h === 'string').slice(-200);
  if (Array.isArray(o.modsDone)) save.modsDone = o.modsDone.filter(h => typeof h === 'string').slice(-100);
  if (o.ups && typeof o.ups === 'object') save.ups = {...o.ups};
  if (o.trophies && typeof o.trophies === 'object') save.trophies = {...o.trophies};
  save.stats = Object.assign({...DEF_STATS}, o.stats || {});
  if (typeof o.nick === 'string') save.nick = o.nick.slice(0, 16);
  if (typeof o.rec === 'string' && typeof o.recSalt === 'string'){ save.rec = o.rec; save.recSalt = o.recSalt; }
  if (COUNTRIES.some(c => c[0] === o.country)) save.country = o.country;
  if (AVATARS.includes(o.avatar)) save.avatar = o.avatar;
  if (o.lang === 'en' || o.lang === 'he') save.lang = o.lang;
  save.settings = Object.assign({...DEF_SET}, o.settings || {});
  if (old){
    // older versions: keep whatever you already had
    if (o.mute) save.settings.sound = false;
    for (const id of (o.loadout || [])) if (!save.abils.includes(id) && ABILS.some(a => a.id === id)) save.abils.push(id);
    if (SHIPS[o.ship] && !save.owned.includes(o.ship)) save.owned.push(o.ship);
  }
  for (const i of [0,1,2]) if (!save.owned.includes(i)) save.owned.push(i);
  for (const id of ['dash','barrier']) if (!save.abils.includes(id)) save.abils.push(id);
  save.v = 5;
}

    if (!d || !u) throw 0;

        const r = s.data();
        if (num(r.xp) > save.xp && typeof r.json === 'string'){
          loadInto(JSON.parse(r.json)); fixLoadout();
          try { localStorage.setItem('astro-save', JSON.stringify(save)); } catch(e){}

    } catch(e){}
    try { db.doc('mods/' + uid).onSnapshot(applyMods, () => {}); } catch(e){}

// one-time changes the admin sent to this player (give/take, remove an item, reset)
function applyMods(snap){
  if (!snap.exists) return;
  const ops = (snap.data() || {}).ops;
  if (!Array.isArray(ops)) return;
  let changed = false;
  for (const op of ops){
    if (!op || typeof op.id !== 'string' || save.modsDone.includes(op.id)) continue;
    if (op.t === 'reset'){
      const keep = {rec:save.rec, recSalt:save.recSalt, nick:save.nick, country:save.country, avatar:save.avatar, lang:save.lang, settings:save.settings, redeemed:save.redeemed, modsDone:save.modsDone};
      Object.assign(save, fresh(), keep);
    } else if (op.t === 'add'){
      for (const k of ['coins','gems','xp']) if (Number.isFinite(+op[k])) save[k] = Math.max(0, save[k] + Math.round(+op[k]));
    } else if (op.t === 'rm'){
      if (op.kind === 'ship' && +op.key > 2){ save.owned = save.owned.filter(i => i !== +op.key); }
      if (op.kind === 'abil' && op.key !== 'dash' && op.key !== 'barrier'){ save.abils = save.abils.filter(i => i !== op.key); }
      if (op.kind === 'skin'){ save.skins = save.skins.filter(i => i !== op.key); if (save.skin === op.key) save.skin = ''; }
    }
    save.modsDone.push(op.id); changed = true;
  }
  if (!changed) return;
  save.modsDone = save.modsDone.slice(-100);
  fixLoadout(); persist(); toast('👑', esc(tr('adminMsg')));
  if (state === 'menu' && curScreen) show(curScreen);
}

  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('astro-code:' + s));

}

let ac = null, master = null;
function beep(freq, dur, type='square', vol=.05, slide=0, delay=0){
  if (!ac || !save.settings.sound) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq+slide), t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(master); o.start(t); o.stop(t+dur);
}
function noise(dur, vol=.12){
  if (!ac || !save.settings.sound) return;
  const len = ac.sampleRate * dur, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = vol;
  s.buffer = buf; s.connect(f).connect(g).connect(master); s.start();
}
const jingle = notes => notes.forEach((n,i) => beep(n, .14, 'triangle', .07, 0, i*.09));

}

// The game makes a random password (so nobody reuses a real one). A copy of the save is
// encrypted with it and kept in recover/<uid>, found by nickname, so it opens on any account.
const REC_AB = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
const normRec = s => String(s).toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 16);
const showRec = s => normRec(s).replace(/(.{4})(?=.)/g, '$1-');
const b64 = u => btoa(String.fromCharCode(...u));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let recKeyMemo = {k:'', v:null}, recVisible = false, recTry = 0;
function makeRec(){
  const b = crypto.getRandomValues(new Uint8Array(24)), out = [];
  for (const x of b){ if (x < 248) out.push(REC_AB[x % 31]); if (out.length === 16) break; }
  while (out.length < 16) out.push(REC_AB[crypto.getRandomValues(new Uint8Array(1))[0] % 31]);
  return out.join('');
}
async function recKey(code, salt){
  const k = normRec(code) + '|' + salt;
  if (recKeyMemo.k === k) return recKeyMemo.v;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(normRec(code)), 'PBKDF2', false, ['deriveKey']);
  const v = await crypto.subtle.deriveKey({name:'PBKDF2', salt:new TextEncoder().encode('astro-rec:' + salt), iterations:150000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']);
  recKeyMemo = {k, v}; return v;
}
async function pushRec(json, now){
  try {
    const key = await recKey(save.rec, save.recSalt), iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(json)));
    await db.doc('recover/' + uid).set({nickKey:nickKey(save.nick), salt:save.recSalt, iv:b64(iv), ct:b64(ct), t:now});
  } catch(e){}
}

async function findRec(nick, code){
  const snap = await db.collection('recover').where('nickKey', '==', nickKey(nick)).limit(10).get();
  let best = null;
  for (const d of snap.docs){
    const r = d.data();
    try {
      const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(r.iv)}, await recKey(code, r.salt), unb64(r.ct));
      const o = JSON.parse(new TextDecoder().decode(pt));
      if (!best || num(r.t) > best.t) best = {o, t:num(r.t)};
    } catch(e){}
  }
  return best && best.o;
}

// freeze = stop the game without showing the pause screen (used by the home button and the settings gear)

function bank(){

  }

// ---------- abilities ----------
function useAbility(i){
  if (state !== 'play') return;
  const s = abilState[i]; if (!s || s.cd > 0) return;
  s.cd = testGame && debug.nocd ? .3 : s.max;
  const id = s.a.id, ca = Math.cos(ship.a), sa = Math.sin(ship.a);
  if (id === 'dash'){
    ship.vx = ca*700; ship.vy = sa*700; ship.inv = Math.max(ship.inv, .45);
    for (let k=0;k<20;k++) parts.push({x:ship.x-ca*k*3, y:ship.y-sa*k*3, vx:rnd(-20,20), vy:rnd(-20,20), life:.4, color:S.color, size:3});
    beep(300,.2,'sawtooth',.05,900);
  } else if (id === 'barrier'){
    timers.shield = Math.max(timers.shield || 0, 5); ring(ship.x, ship.y, POW.shield.c, 60, 200); beep(500,.3,'triangle',.07,300);
  } else if (id === 'missile'){
    for (let k=0;k<6;k++){ const a = ship.a + (k - 2.5) * .35; bullets.push({x:ship.x, y:ship.y, vx:Math.cos(a)*260, vy:Math.sin(a)*260, life:3, r:3, color:'#ff9f43', homing:true, dmg:3}); }
    beep(200,.4,'sawtooth',.06,500);
  } else if (id === 'shock'){
    const R = 210; ring(ship.x, ship.y, '#ffe066', R, 800); ring(ship.x, ship.y, '#fff', R*.7, 700); shake = 14; noise(.5,.18);
    for (const r of rocks.slice()) if (!r.dead && Math.hypot(r.x-ship.x, r.y-ship.y) < R + r.r){ r.hp = 0; killRock(r, true); }
    rocks = rocks.filter(r => !r.dead);
    for (const u of ufos) if (!u.dead && Math.hypot(u.x-ship.x, u.y-ship.y) < R + u.r) hitUfo(u, 3);
    if (boss && Math.hypot(boss.x-ship.x, boss.y-ship.y) < R + boss.r) damageBoss(6);
    ebullets = ebullets.filter(e => Math.hypot(e.x-ship.x, e.y-ship.y) > R);
  } else if (id === 'freeze'){
    timers.freeze = dur('freeze'); flash = .4; beep(1800,.5,'sine',.05,-1200);
  } else if (id === 'clone'){
    timers.clone = dur('clone'); ring(W-ship.x, H-ship.y, POW.clone.c, 60); jingle([660,990]);
  } else if (id === 'vortex'){
    vortices.push({x:ship.x + ca*140, y:ship.y + sa*140, t:5, r:14}); beep(90,1,'sine',.08,-40);
  } else if (id === 'ult'){
    timers.ult = dur('ult'); shake = 10; beep(120,1.2,'sawtooth',.07,300);
  }
}

function boom(x, y, n, color, speed=180){

// ---------- update ----------
function update(dt){

  if (gmode === 'bonus'){
    bonusT -= dt;
    if (bonusT <= 0){ bonusT = 0; updateHud(); gameOver(); return; }
  }
  // ship movement
  if (keys.left) ship.a -= S.turn*dt;
  if (keys.right) ship.a += S.turn*dt;
  ship.thrust = keys.up;
  if (keys.up){
    ship.vx += Math.cos(ship.a)*S.acc*dt; ship.vy += Math.sin(ship.a)*S.acc*dt;
    for (let i=0;i<2;i++) parts.push({x:ship.x-Math.cos(ship.a)*14, y:ship.y-Math.sin(ship.a)*14,
      vx:-Math.cos(ship.a)*140+rnd(-40,40), vy:-Math.sin(ship.a)*140+rnd(-40,40), life:.35, color: Math.random()<.5?'#ff9f43':'#ffe066', size:3});
  }
  // backwards: a bit weaker than forward, with small puffs from the nose

    ship.vx -= Math.cos(ship.a)*S.acc*.65*dt; ship.vy -= Math.sin(ship.a)*S.acc*.65*dt;

  }

      return d;
    };

    }

  if (treasureT > 0){ treasureT -= dt; if (treasureT <= 0){ spawnTreasure(); if (gmode === 'bonus') treasureT = 6; } }
  for (const u of ufos){

function laserHits(dmg){
  const b = laserBeam, a0 = laserFrom === null ? b.a : laserFrom, span = angNorm(b.a - a0);

  const hitOn = (x, y, r) => {
    const dx = x-b.x, dy = y-b.y;
    if (onLine(dx, dy, b.a, r) || onLine(dx, dy, a0, r)) return true;
    const rel = angNorm(Math.atan2(dy, dx) - a0);
    return span >= 0 ? rel >= 0 && rel <= span : rel <= 0 && rel >= span;
  };
  for (const r of rocks.slice()) if (!r.dead && hitOn(r.x, r.y, r.r)){ r.hp -= dmg; r.hit = .1; if (r.hp <= 0) killRock(r, true); }
  rocks = rocks.filter(r => !r.dead);
  for (const u of ufos) if (!u.dead && hitOn(u.x, u.y, u.r)) hitUfo(u, dmg);
  if (boss && hitOn(boss.x, boss.y, boss.r)) damageBoss(b.ult ? 1 : dmg);
  for (const e of ebullets) if (hitOn(e.x, e.y, e.r)) e.life = 0;
}

// ---------- 1v1 against a random player from anywhere ----------
// lobby/<id>  "I'm looking for a match" (refreshed every few seconds while searching)
// duel/<id>   an offer from a host to a guest; the guest accepts by writing match:<host> in its lobby row
// duelp/<id>  my live status during the match (score, hearts, alive), read by the other player
// The player with the smaller id makes the offer, so two players never offer to each other at once.
let duel = null, duelRes = null, mm = null;
const LOBBY_FRESH = 30000;

// both players get the same random ship and the same two powers
function rollDuel(seed){
  const r = mulberry(seed), ship = Math.floor(r() * SHIPS.length);
  const pool = ABILS.map(a => a.id);
  for (let i = pool.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  let abils = pool.slice(0, 2);
  if (SHIPS[ship].ninja && !abils.includes('dash')) abils = ['dash', abils[0]];
  return {ship, abils};
}

function startMatch(){

  mm = me;
  const beat = () => { if (mm === me && me.on) db.doc('lobby/' + uid).set(me4lobby()).catch(() => {}); };
  beat(); me.hb = setInterval(beat, 4000);
  const tick = async () => {
    if (mm !== me || !me.on || me.busy) return;

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function matchTick(me){
  const now = Date.now();
  // 1. did someone offer me a match?
  const offers = await db.collection('duel').where('guest', '==', uid).get();
  if (mm !== me || !me.on) return;
  const offer = offers.docs.map(d => ({id:d.id, ...d.data()})).find(o => o.state === 'offer' && Math.abs(now - num(o.t)) < 15000 && !me.tried['o' + o.id + o.seed]);
  if (offer){
    me.tried['o' + offer.id + offer.seed] = 1;
    await db.doc('lobby/' + uid).set(me4lobby({match:offer.id}));
    for (let i = 0; i < 12 && mm === me && me.on; i++){
      await sleep(700);
      const s = await db.doc('duel/' + offer.id).get().catch(() => null);
      const d = s && s.exists ? s.data() : null;
      if (!d || d.guest !== uid || d.seed !== offer.seed || d.state === 'cancel') break;
      if (d.state === 'go') return beginDuel(me, {host:offer.id, opp:offer.id, nick:d.hostNick, av:d.hostAv, seed:d.seed});
    }
    if (mm === me && me.on) await db.doc('lobby/' + uid).set(me4lobby()).catch(() => {});
    return;
  }
  // 2. who else is looking right now?
  const snap = await db.collection('lobby').where('want', '==', true).get();
  if (mm !== me || !me.on) return;
  const others = snap.docs.map(d => ({id:d.id, ...d.data()})).filter(o => o.id !== uid && Math.abs(now - num(o.t)) < LOBBY_FRESH);
  me.n = others.length;
  duelScreen(tr('duelSearch'), others.length ? tr('duelWaiting', {n:others.length}) : tr('duelD'));
  // 3. make an offer to one of them (only to bigger ids, the others will offer to me)
  const cands = others.filter(o => o.id > uid && !o.match && !(me.tried['h' + o.id] > now));
  if (!cands.length) return;
  cands.sort((a, b) => Math.abs(num(a.rank) - myRank()) - Math.abs(num(b.rank) - myRank()));
  const g = cands[0], seed = 1 + Math.floor(Math.random() * 2e9);
  me.tried['h' + g.id] = now + 20000;
  await db.doc('duel/' + uid).set({host:uid, guest:g.id, seed, state:'offer', t:Date.now(), hostNick:save.nick, hostAv:save.avatar, guestNick:String(g.nick || ''), guestAv:String(g.avatar || '')});
  for (let i = 0; i < 10 && mm === me && me.on; i++){
    await sleep(700);
    const s = await db.doc('lobby/' + g.id).get().catch(() => null);
    const d = s && s.exists ? s.data() : null;
    if (d && d.match === uid){
      await db.doc('duel/' + uid).update({state:'go', t:Date.now()});
      return beginDuel(me, {host:uid, opp:g.id, nick:g.nick, av:g.avatar, seed});
    }
  }
  await db.doc('duel/' + uid).update({state:'cancel'}).catch(() => {});
}

function stopMatch(){
  if (!mm) return;
  const me = mm; mm = null; me.on = false;
  clearInterval(me.hb); clearInterval(me.tick);
  if (db && uid && !me.begun) db.doc('lobby/' + uid).set(me4lobby({want:false})).catch(() => {});
}
function beginDuel(me, o){
  if (mm !== me) return;
  me.begun = true; stopMatch();
  db.doc('lobby/' + uid).set(me4lobby({want:false})).catch(() => {});
  const roll = rollDuel(o.seed), sh = SHIPS[roll.ship];
  duel = {id:o.host + ':' + o.seed, host:o.host, opp:o.opp, oppNick:String(o.nick || '?').slice(0, 16), oppAv:String(o.av || '👾').slice(0, 4), seed:o.seed,
    ship:roll.ship, abils:roll.abils, el:0, oppLast:0, gotFirst:false, over:false, opS:0, opL:3, timers:[], unsub:null, startT:0, diedT:0};
  jingle([523,659,784,1047]);
  $('duelScreen').classList.add('found');
  $('duelCancel').hidden = true;
  $('duelAv').textContent = duel.oppAv;
  const pw = roll.abils.map(id => { const a = ABILS.find(x => x.id === id); return `<span style="color:${a.c}">${a.icon} ${esc(L(a.n))}</span>`; }).join(' · ');
  duelScreen(tr('duelFound', {nick:duel.oppNick}), tr('duelRoll'),
    `<div class="roll"><b style="color:${sh.color}">🚀 ${esc(L(sh.n))}</b><small>${esc(L(sh.d))}</small><div>${pw}</div></div>`);
  const d = duel;
  setTimeout(() => { if (duel === d && curScreen === 'duel') start({mode:'duel', level:3}); }, 3200);
}
// the match itself: send my status every second, listen to the other player's
function duelGo(){
  const d = duel; if (!d) return;
  duelRes = null; d.startT = Date.now(); d.el = 0;
  const send = extra => db.doc('duelp/' + uid).set({duel:d.id, nick:save.nick, score:Math.floor(score), lives:Math.max(0, lives), level, alive:d.diedT === 0, el:Math.round(d.el * 10) / 10, t:Date.now(), done:false, winner:'', why:'', ...extra}).catch(() => {});
  d.send = send;
  send();
  d.timers.push(setInterval(() => {
    if (duel !== d || d.over) return;
    if (state !== 'pause') send(); // a paused player stops reporting, so pausing too long loses the match
    const quiet = Date.now() - (d.oppLast || d.startT);
    if (quiet > (d.gotFirst ? 20000 : 30000)) finishDuel(true, 'left');
    duelBar();
  }, 1000));
  const read = s => { if (s && s.exists) gotOpp(s.data()); };
  try { d.unsub = db.doc('duelp/' + d.opp).onSnapshot(read, () => {}); } catch(e){}
  d.timers.push(setInterval(() => { if (duel === d && !d.over) db.doc('duelp/' + d.opp).get().then(read).catch(() => {}); }, 2500));
  duelBar();
}
function gotOpp(o){
  const d = duel;
  if (!d || d.over || !o || o.duel !== d.id) return;
  if (num(o.t) !== d.lastT){ d.lastT = num(o.t); d.oppLast = Date.now(); d.gotFirst = true; }
  d.opS = num(o.score); d.opL = num(o.lives);
  if (o.done) return finishDuel(o.winner === uid, o.winner === uid ? (o.why === 'quit' || o.why === 'left' ? 'left' : 'win') : 'lose');
  if (o.alive === false){
    if (d.diedT === 0) return finishDuel(true, 'win');
    // we both fell: whoever lasted longer wins (then score, then a coin toss everyone agrees on)
    const mine = [d.el, score], theirs = [num(o.el), num(o.score)];
    const win = mine[0] !== theirs[0] ? mine[0] > theirs[0] : mine[1] !== theirs[1] ? mine[1] > theirs[1] : uid < d.opp;
    finishDuel(win, win ? 'win' : 'lose');
  }
  duelBar();
}
function duelDied(){
  const d = duel; if (!d || d.over) return gameOver();
  d.diedT = Date.now(); state = 'wait';
  boom(ship.x, ship.y, 60, S.color, 260); flash = .6;
  floatText(W/2, H*.45, tr('duelWaitT'), '#ffe066', 22);
  d.send({alive:false});
  // if the other player says nothing for a while, they lost the connection: count it as their loss of the race
  setTimeout(() => { if (duel === d && !d.over) finishDuel(Date.now() - d.oppLast > 15000, 'lose'); }, 9000);
}
function finishDuel(win, why){
  const d = duel; if (!d || d.over) return;
  d.over = true;
  if (why === 'lose' && win) why = 'left';
  duelRes = {win, why, nick:d.oppNick};
  const msg = {done:true, winner:win ? uid : d.opp, why:why === 'quit' ? 'quit' : why, alive:d.diedT === 0 && why !== 'quit'};
  if (d.send){ d.send(msg); setTimeout(() => d.send(msg), 1500); setTimeout(() => d.send(msg), 4000); }
  if (win){ save.duel.w++; trophy('duelWin'); jingle([523,659,784,1047,1319,1568]); } else save.duel.l++;
  if (state === 'play' || state === 'pause' || state === 'wait'){ closeModal(); gameOver(); }
  else persist();
  setTimeout(() => stopDuel(d), 4500);
}
function stopDuel(d = duel){
  if (!d) return;
  d.timers.forEach(clearInterval); d.timers = [];
  try { if (typeof d.unsub === 'function') d.unsub(); } catch(e){}
}
function duelBar(){
  const b = $('duelBar'), d = duel;
  if (!b) return;
  const on = gmode === 'duel' && d && state !== 'over';
  b.hidden = !on;
  if (on){ const h = `<bdi>⚔️ ${esc(d.oppAv)}</bdi> <bdi>${esc(d.oppNick)}</bdi> <bdi>${d.opL > 0 ? '♥×' + d.opL : '💥'}</bdi> · <bdi>${fmt(d.opS)}</bdi>`; if (b.innerHTML !== h) b.innerHTML = h; }
}
$('duelCancel').onclick = () => { click(); stopMatch(); goHome(); };


function loop(t){
  const dt = Math.min(.05, (t - t0)/1000 || 0); t0 = t;
  if (state === 'play') (gmode === 'run' ? updateRun : update)(dt);
  else if (state === 'menu') updateDemo(dt);
  if (state !== 'pause') updateFx(dt);
  if (gmode === 'run' && run && state !== 'menu') drawRun(t); else draw(t);
  requestAnimationFrame(loop);
}
applySettings(); applyLang();
goHome();
requestAnimationFrame(loop);
initCloud();
})();
</script>
